{% extends 'base.html' %}

{% block title %}创建备货生产任务{% endblock %}

{% block extra_css %}
<style>
    @media (max-width: 767.98px) {
        .card-header {
            text-align: center;
            padding: 1rem;
        }
        
        .card-header h5 {
            font-size: 1.125rem;
        }
        
        .card-body form .row {
            flex-direction: column;
            gap: 1rem;
        }
        
        .card-body form .col-md-6,
        .card-body form .col-12 {
            width: 100%;
        }
        
        .card-body form label {
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .card-body form select,
        .card-body form input[type="number"],
        .card-body form input[type="date"],
        .card-body form textarea {
            font-size: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }
        
        .card-body form textarea {
            min-height: 100px;
        }
        
        .card-body form .d-flex {
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .card-body form .d-flex a,
        .card-body form .d-flex button {
            width: 100%;
            min-height: 48px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-plus-circle"></i> 创建备货生产任务</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="product" class="form-label">产品 <span class="text-danger">*</span></label>
                    <select name="product" id="product" class="form-select" required>
                        <option value="">请选择产品</option>
                        {% for product in products %}
                        <option value="{{ product.pk }}" data-unit="{{ product.display_unit.name }}">{{ product.sku }} - {{ product.name }}（{{ product.display_unit.name }}）</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="required_quantity" class="form-label">需求数量 <span id="quantity-unit" class="text-muted"></span> <span class="text-danger">*</span></label>
                    <input type="number" name="required_quantity" id="required_quantity" class="form-control" step="0.01" min="0.01" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="planned_completion_date" class="form-label">计划完成日期</label>
                    <input type="date" name="planned_completion_date" id="planned_completion_date" class="form-control">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-12">
                    <label for="remark" class="form-label">备注</label>
                    <textarea name="remark" id="remark" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="d-flex justify-content-between">
                <a href="{% url 'production:task_list' %}" class="btn btn-secondary">取消</a>
                <button type="submit" class="btn btn-primary">创建备货生产任务</button>
            </div>
        </form>
    </div>
</div>
<script>
document.getElementById('product').addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    const unit = opt.dataset.unit || '';
    const span = document.getElementById('quantity-unit');
    span.textContent = unit ? `（${unit}）` : '';
});
</script>
{% endblock %}
