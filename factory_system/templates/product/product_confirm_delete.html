{% extends 'base.html' %}

{% block title %}删除产品 - {{ product.name }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h4><i class="bi bi-exclamation-triangle"></i> 确认删除产品</h4>
    </div>
    <div class="card-body">
        <p>确定要删除产品 <strong>{{ product.sku }} - {{ product.name }}</strong> 吗？此操作不可恢复。</p>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">确认删除</button>
            <a href="{% url 'product:product_list' %}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
{% endblock %}
